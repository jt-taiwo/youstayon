name: youstayon
description: YouStayOn Mobile Fintech & Connectivity Platform
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3

  dio: ^5.7.0

  connectivity_plus: ^7.1.1

  shared_preferences: ^2.5.2

  # google_maps_flutter: ^2.17.1

  # flutter_local_notifications: ^21.0.0

  # workmanager: ^0.9.0+3

  # another_telephony: ^0.4.1

  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  lottie: ^3.3.3

  confetti: ^0.8.0

  # share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13

  isar_community_generator: ^3.3.2

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
    - assets/illustrations/
    - assets/avatars/
    - assets/backgrounds/
    - assets/networks/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700